name: Build EDGS A10 image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.acs
      - requirements.acs.txt
      - tools/edgs_gpu_smoke.py
      - tools/edgs_e2e_smoke.py
      - .github/workflows/build-ghcr.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: edgs-a10-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force || true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.acs
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/19980407/edgs-a10:cuda12.1
            ghcr.io/19980407/edgs-a10:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
          provenance: false
